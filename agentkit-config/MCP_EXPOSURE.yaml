version: 2
purpose: >
  Public demo MCP allowlist and the intended production service split. The
  public demo backend is implemented in services/ems-governance/server.py;
  cloud resources still need to be created by following docs/DEPLOYMENT.md.

demo_service:
  name: ems-impact-week-demo
  backend: services/ems-governance/
  transport: streamable-http
  endpoint_path: /mcp
  input_data: repository snapshot under ../data/feishu/
  simplybook_mode_default: mock
  tools_visible_to_orchestrator:
    - list_events
    - list_sessions
    - list_participants
    - list_enrollment_requests
    - simplybook_list_calendars
    - simplybook_list_bookings
    - request_temporary_grant
    - get_grant
    - prepare_change_set
    - get_change_set
    - freeze_change_set
    - submit_change_set_approval
  tools_never_visible_to_agent:
    - direct booking or cancellation
    - email sending
    - Impact Key update
    - reviewer approval
    - Worker execution
  demo_only_routes:
    reviewer:
      - GET /demo/reviewer/queue
      - POST /demo/reviewer/grants/{grantId}/approve
      - POST /demo/reviewer/change-sets/{changeSetId}/approve
    worker:
      - POST /internal/change-sets/{changeSetId}/execute
      - GET /internal/jobs/{jobId}
    auth_env:
      grant_reviewer: EMS_DEMO_GRANT_REVIEWER_KEY
      changeset_reviewer: EMS_DEMO_CHANGESET_REVIEWER_KEY
      worker: EMS_DEMO_WORKER_KEY
    behavior: >
      Worker validates Grant status/scope/expiry, approval status, frozen hash,
      and idempotency, then records a simulated job. It never calls customer
      write endpoints.

future_live_service_split:
  feishu-base-read:
    source: Feishu Base OpenAPI
    exposed_to:
      - orchestrator Agent
      - scheduled data-auditor Agent
    permissions: [read approved demo Base only]
    deny: [create records, update records, delete records]
    note: The current demo reads committed JSON snapshots, not a live Base.

  simplybook-agent-read:
    source_openapi: ../contracts/SIMPLY_BOOK_OPENAPI.yaml
    operations:
      - GET /calendars
      - GET /calendars/{calendarId}/bookings
    auth_headers: [Token, Appid, Lang, Platform]
    note: >
      The code maps this read-only subset. Mock mode is default; live mode must
      be validated against a customer-approved non-production endpoint.

  simplybook-worker-write:
    exposed_to: [private Worker only]
    never_publish_to_agent_mcp: true
    status: not implemented; customer write API semantics are unconfirmed

  ems-governance-live:
    source_openapi: ../contracts/EMS_GOVERNANCE_AGENT_OPENAPI.yaml
    exposed_to: [orchestrator Agent]
    operations: [request Grant, prepare/freeze Change Set, submit for approval]
    status: demo implementation only; employee identity and Feishu approval are not connected

  impact-key-sync:
    exposed_to: [private Worker only]
    status: contract not supplied; demo projection only

  scheduled_audit_trigger:
    owner: customer scheduler or approved Feishu Workflow
    status: not configured
