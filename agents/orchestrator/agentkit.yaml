common:
  agent_name: ems-orchestrator
  entry_point: ems-orchestrator.py
  description: AgentKit project ems-orchestrator - Agent Server App
  language: Python
  language_version: '3.12'
  agent_type: WebServer App
  dependencies_file: requirements.txt
  launch_type: cloud
launch_types:
  cloud:
    region: cn-beijing
    tos_bucket: agentkit-platform-{{account_id}}
    tos_prefix: agentkit-builds
    image_tag: '{{timestamp}}'
    cr_instance_name: agentkit-platform-{{account_id}}
    cr_namespace_name: agentkit
    cr_repo_name: ems-orchestrator
    cr_auto_create_instance_type: Micro
    build_timeout: 3600
    cp_workspace_name: agentkit-cli-workspace
    cp_pipeline_name: Auto
    project_name: default
    runtime_id: Auto
    runtime_name: ems-iw-demo-orchestrator
    runtime_role_name: Auto
    runtime_auth_type: key_auth
    runtime_apikey_name: Auto
    runtime_apikey: Auto
    runtime_jwt_allowed_clients: []
    runtime_envs:
      EMS_DEMO_MCP_URL: ${EMS_DEMO_MCP_URL:?Create the demo MCP service first}
      EMS_DEMO_MCP_AUTH_KEY: ${EMS_DEMO_MCP_AUTH_KEY:?Set the MCP inbound API key in .env}
      EMS_SCHEDULE_CHECKER_AGENT_CARD_URL: ${EMS_SCHEDULE_CHECKER_AGENT_CARD_URL:?Deploy the schedule checker first}
      EMS_SCHEDULE_CHECKER_A2A_AUTH_KEY: ${EMS_SCHEDULE_CHECKER_A2A_AUTH_KEY:?Set the schedule checker Runtime API key in .env}
docker_build: {}
