version: 1
purpose: >
  Human-reviewed exposure plan for AgentKit MCP Gateway setup. This is not a
  directly importable AgentKit configuration file.

services:
  feishu-base-read:
    source: Feishu OpenAPI Base record-read operations
    exposed_to:
      - orchestrator Agent
      - scheduled data-auditor Agent
    permissions:
      - read approved demo Base only
    deny:
      - create records
      - update records
      - delete records
    notes:
      - Use a dedicated application identity with Base read permission, or an explicitly approved user authorization flow.
      - The interactive operator Grant and scheduled Agent machine identity are different principals.

  simplybook-agent-read:
    source_openapi: ../contracts/SIMPLY_BOOK_OPENAPI.yaml
    source_backend: SimplyBook EMS backend on Alibaba Cloud
    authentication:
      method: customer-approved service identity
      headers: [Token, Appid, Lang, Platform]
    exposed_to_agent:
      include:
        - GET /locations
        - GET /locations/{locationId}
        - GET /locations/{locationId}/timetable
        - GET /practitioners
        - GET /practitioners/{practitionerId}
        - GET /calendars
        - GET /calendars/{calendarId}
        - GET /calendars/active-dates
        - GET /calendars/search
        - GET /calendars/{calendarId}/bookings
      exclude:
        - all direct booking, cancellation, credits, stock, and favorite writes
        - every operation whose x-internal-route is null until route verification
    notes:
      - Keep reads paginated and bounded by event/date/session.
      - Never place a SimplyBook JWT in Agent prompt or tool arguments.
      - Tool descriptions should explain side effects; read service should have no write scope.

  simplybook-worker-write:
    source_openapi: ../contracts/SIMPLY_BOOK_OPENAPI.yaml
    source_backend: SimplyBook EMS backend on Alibaba Cloud
    authentication:
      method: dedicated Worker workload identity and backend credential
      headers: [Token, Appid, Lang, Platform]
    exposed_to:
      - private EMS Worker only
    operations:
      allow_after_route_and_semantics_validation:
        - POST /calendars/{calendarId}/bookings
        - POST /bookings/{bookingId}/cancel
        - POST /credits/recharge
      deny_until_customer_confirms_real_route:
        - POST /credits/refund
        - POST /calendars/{calendarId}/stock
      never_expose_to:
        - orchestrator Agent
        - schedule-checker Agent
    notes:
      - This is an OpenAPI-to-MCP service, but its caller is the Worker, not the Agent.
      - The Worker must verify approval, Grant, exact hash, source freshness, expiry, and idempotency before invoking it.
      - The booking-count API cannot bind returned booking IDs to named participants; use a customer-confirmed endpoint or demo mock for named enrollment.

  ems-governance-agent:
    source_openapi: ../contracts/EMS_GOVERNANCE_AGENT_OPENAPI.yaml
    exposed_to_agent:
      include:
        - requestTemporaryGrant
        - listMyGrants
        - getGrant
        - prepareChangeSet
        - getChangeSet
        - freezeChangeSet
        - submitChangeSetApproval
      exclude:
        - executeApprovedChangeSet
        - Feishu approval callback
    notes:
      - Authenticated human subject is derived from a verified token or trusted identity broker, never from prompt text.
      - Request Grant and Change Set submission only; neither operation executes a business write.
      - The Agent MCP credential is not a replacement for the operator's EMS business Grant.

worker_only:
  source_openapi: ../contracts/EMS_WORKER_INTERNAL_OPENAPI.yaml
  identity: dedicated worker workload identity
  secret_mount: worker runtime only
  operations:
    - executeApprovedChangeSet
    - getWorkerJob
    - demoImpactKeyProjection
    - private SimplyBook write MCP service
  never_publish_to_agent_mcp: true

scheduled_audit_trigger:
  owner: customer scheduler or approved Feishu Workflow
  identity: dedicated read-only machine identity
  actions:
    - invoke ems-data-auditor
    - write a review report only if a customer-approved destination is supplied
  must_not:
    - edit or delete source rows
    - send mail
    - enroll or remove participants
