<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">AgentKit Runtime Ready but model invocation fails</title>
  <desc id="desc">Sanitized evidence card reconstructed from the observed CLI output on 2026-09-29. It is not an original console screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#172b42"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1440" height="850" fill="url(#bg)"/>
  <circle cx="1290" cy="70" r="260" fill="#1f4561" opacity=".22"/>
  <text x="82" y="88" fill="#dbeafe" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">AGENTKIT · ISSUE REPRODUCTION RECORD</text>
  <text x="82" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-size="43" font-weight="700">Runtime Ready, model call failed</text>
  <text x="84" y="195" fill="#a8bfd2" font-family="Arial, sans-serif" font-size="21">Observed during EMS demo validation · 2026-09-29 · cn-beijing</text>
  <rect x="82" y="242" width="1276" height="450" rx="20" fill="#0c1119" stroke="#39536b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="82" y="242" width="1276" height="62" rx="20" fill="#1c2632"/>
  <path d="M82 284h1276v20H82z" fill="#1c2632"/>
  <circle cx="116" cy="273" r="8" fill="#ff6c62"/><circle cx="145" cy="273" r="8" fill="#f4bd4f"/><circle cx="174" cy="273" r="8" fill="#43c97b"/>
  <text x="720" y="280" fill="#9aaabd" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">redacted AgentKit invocation output</text>
  <text x="125" y="365" fill="#8bd5ca" font-family="Menlo, Consolas, monospace" font-size="20">$ agentkit runtime show ems-iw-demo-schedule-checker</text>
  <text x="125" y="405" fill="#c5d2df" font-family="Menlo, Consolas, monospace" font-size="20">Runtime status: <tspan fill="#7ee787" font-weight="700">Ready</tspan></text>
  <text x="125" y="470" fill="#8bd5ca" font-family="Menlo, Consolas, monospace" font-size="20">$ agentkit invoke run --runtime-id &lt;runtime-id&gt; --region cn-beijing --a2a</text>
  <rect x="115" y="502" width="1208" height="107" rx="10" fill="#271719" stroke="#713b40"/>
  <text x="145" y="544" fill="#ff8989" font-family="Menlo, Consolas, monospace" font-size="19">The model or endpoint doubao-seed-1-8-251228 does not exist</text>
  <text x="145" y="578" fill="#ff8989" font-family="Menlo, Consolas, monospace" font-size="19">or you do not have access to it.</text>
  <rect x="115" y="628" width="1208" height="1" fill="#293747"/>
  <text x="125" y="666" fill="#b8c7d8" font-family="Arial, sans-serif" font-size="18">After explicitly configuring an account-enabled model and endpoint, a direct A2A invocation succeeded.</text>
  <rect x="82" y="729" width="1276" height="68" rx="13" fill="#243746" stroke="#45657a"/>
  <text x="112" y="759" fill="#d7e6f3" font-family="Arial, sans-serif" font-size="17" font-weight="700">EVIDENCE NOTE</text>
  <text x="270" y="759" fill="#bfd0dc" font-family="Arial, sans-serif" font-size="17">Sanitized reconstruction from the recorded CLI result; not an original console screenshot.</text>
  <text x="270" y="783" fill="#9fb4c4" font-family="Arial, sans-serif" font-size="15">Product ownership remains unconfirmed: model entitlement/configuration is the direct failure cause.</text>
</svg>
