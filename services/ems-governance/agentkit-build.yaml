common:
  agent_name: ems_governance_mcp
  entry_point: server.py
  description: Synthetic EMS governance MCP backend image builder
  language: Python
  language_version: "3.12"
  agent_type: WebServer App
  dependencies_file: requirements.txt
  launch_type: cloud
launch_types:
  cloud:
    region: cn-beijing
    tos_bucket: agentkit-platform-{{account_id}}
    tos_prefix: agentkit-builds
    image_tag: "{{timestamp}}"
    cr_instance_name: agentkit-platform-{{account_id}}
    cr_namespace_name: agentkit
    cr_repo_name: ems-governance-demo
    cr_auto_create_instance_type: Micro
    build_timeout: 3600
    cp_workspace_name: agentkit-cli-workspace
    cp_pipeline_name: ems-iw-demo-mcp-image-builder
    project_name: default
    runtime_id: Auto
    runtime_name: ems-iw-demo-mcp-image-builder
    runtime_role_name: Auto
    runtime_auth_type: key_auth
    runtime_apikey_name: Auto
    runtime_apikey: Auto
    runtime_jwt_allowed_clients: []
docker_build: {}
