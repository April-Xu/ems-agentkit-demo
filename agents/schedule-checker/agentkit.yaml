common:
  agent_name: ems-schedule-checker
  entry_point: ems-schedule-checker.py
  description: AgentKit project ems-schedule-checker - A2A Agent App
  language: Python
  language_version: '3.12'
  agent_type: A2A App
  dependencies_file: requirements.txt
  launch_type: cloud
launch_types:
  cloud:
    region: cn-beijing
    tos_bucket: agentkit-platform-{{account_id}}
    tos_prefix: agentkit-builds
    image_tag: '{{timestamp}}'
    cr_instance_name: agentkit-platform-{{account_id}}
    cr_namespace_name: agentkit
    cr_repo_name: ems-schedule-checker
    cr_auto_create_instance_type: Micro
    build_timeout: 3600
    cp_workspace_name: agentkit-cli-workspace
    cp_pipeline_name: Auto
    project_name: default
    runtime_id: Auto
    runtime_name: ems-iw-demo-schedule-checker
    runtime_role_name: Auto
    runtime_auth_type: key_auth
    runtime_apikey_name: Auto
    runtime_apikey: Auto
    runtime_jwt_allowed_clients: []
    runtime_envs:
      EMS_SCHEDULE_CHECKER_PUBLIC_URL: ${EMS_SCHEDULE_CHECKER_PUBLIC_URL:-https://localhost.invalid}
docker_build: {}
